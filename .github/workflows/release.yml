name: Release

# On every push to main, release-please keeps one "Release vX.Y.Z" PR up to
# date (changelog + version bumps, from conventional commit messages).
# Merging that PR creates the tag and GitHub Release, and the same run then
# publishes the Docker images and the Linux desktop packages for it.
#
# Publishing happens in this workflow, not in a separate `on: release` one:
# a release created with the built-in GITHUB_TOKEN does not trigger other
# workflows. For the same reason CI does not run on the release PR itself;
# it only changes version numbers and CHANGELOG.md.
#
# The monthly schedule rebuilds the latest release's images so they pick up
# security fixes in their Python/nginx base images. A manual run rebuilds the
# images and the desktop packages for the latest release, which is how an
# existing release gets a package added after the fact. A manual run with
# `docs_only` republishes just the documentation site.
#
# The documentation site (website/) is built here too, from the release's
# tag, and deployed to GitHub Pages once the repository variable
# DOCS_PUBLISH is "true" (set it after enabling Pages with source "GitHub
# Actions"). Releases older than website/ skip it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      docs_only:
        description: Only rebuild and republish the documentation site
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Which tag to build: the release just created (push), or the latest
  # existing release (schedule / manual run). Empty means nothing to do.
  target:
    needs: release-please
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CREATED: ${{ needs.release-please.outputs.release_created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag=""
            [ "$CREATED" = "true" ] && tag="$CREATED_TAG"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  images:
    needs: target
    if: needs.target.outputs.tag != '' && !inputs.docs_only
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cerebrum-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      # arm64 too, so the images run on Apple Silicon Macs and ARM servers
      # (Raspberry Pi, ARM VPS), not only x86_64. QEMU emulates the other
      # architecture on the x86_64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.target.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.target.outputs.tag }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Linux packages. The schedule only refreshes images, never packages.
  desktop:
    needs: target
    if: needs.target.outputs.tag != '' && github.event_name != 'schedule' && !inputs.docs_only
    # The oldest supported Ubuntu, so the .deb links against an older glibc
    # and installs on more distributions.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - name: Install system packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # No VITE_DEFAULT_SERVER_URL here on purpose: a published build can't
      # know anyone's server, so the app asks for it on first launch.
      - run: npm run tauri build -- --bundles deb,rpm

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm

  # One universal .dmg for Apple Silicon and Intel Macs. Ad-hoc signed, not
  # notarized (that needs a paid Apple Developer ID), so Gatekeeper asks the
  # user to allow it once -- see the docs' desktop app page.
  desktop-macos:
    needs: target
    if: needs.target.outputs.tag != '' && github.event_name != 'schedule' && !inputs.docs_only
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # GitHub sets CI=true, which makes Tauri skip the Finder window-layout
      # step of the .dmg; that step needs a logged-in GUI session and fails
      # in a headless shell. Run locally with CI=true for the same reason.
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # An NSIS setup .exe for 64-bit Windows. Not code-signed, so SmartScreen
  # warns on first run -- see the docs' desktop app page. The desktop smoke
  # test workflow installs and launches this same build on every desktop PR.
  desktop-windows:
    needs: target
    if: needs.target.outputs.tag != '' && github.event_name != 'schedule' && !inputs.docs_only
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - run: npm run tauri build -- --bundles nsis

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            src-tauri/target/release/bundle/nsis/*-setup.exe

  # The no-clone installer (deploy/install.sh) and the compose file it
  # downloads, pinned to this release. Runs after the images exist, so the
  # `latest` download link never points at a compose file whose images are
  # still being built. Attested like every other release asset.
  install-assets:
    needs: [target, images]
    if: needs.target.outputs.tag != '' && github.event_name != 'schedule' && !inputs.docs_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      # Releases older than the installer have nothing to publish; a manual
      # run against one of them must not fail.
      - id: present
        run: |
          if [ -f deploy/install.sh ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Pin the release into the installer and its compose file
        if: steps.present.outputs.present == 'true'
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          sed "s/CEREBRUM_VERSION:-latest/CEREBRUM_VERSION:-${version}/g" docker-compose.yml > dist/compose.yaml
          # Only the assignment: the installer's sentinel comparison must keep the placeholder.
          sed "s/^RELEASE_TAG=\"__CEREBRUM_RELEASE_TAG__\"$/RELEASE_TAG=\"${TAG}\"/" deploy/install.sh > dist/install.sh
          # Fail loudly rather than publish a file that still says "latest".
          test "$(grep -c "CEREBRUM_VERSION:-${version}}" dist/compose.yaml)" -eq 2
          grep -q "^RELEASE_TAG=\"${TAG}\"$" dist/install.sh
          test "$(grep -c "__CEREBRUM_RELEASE_TAG__" dist/install.sh)" -eq 1

      - if: steps.present.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/compose.yaml
            dist/install.sh

      - name: Attach the installer to the release
        if: steps.present.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/compose.yaml dist/install.sh

  # The documentation site, built from the release's tag. Runs after the
  # images so the docs never describe a release whose images are not out
  # yet (or right away on a docs-only run, which skips the images). The
  # build job holds only read access; deploying is a separate job, so no
  # build dependency ever runs with the right to publish.
  docs-build:
    needs: [target, images]
    if: >-
      !cancelled() && needs.target.outputs.tag != '' &&
      github.event_name != 'schedule' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      present: ${{ steps.present.outputs.present }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      # Releases older than the site have nothing to build; a run against
      # one of them must not fail.
      - id: present
        working-directory: .
        run: |
          if [ -f website/zensical.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.present.outputs.present == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - if: steps.present.outputs.present == 'true'
        run: uv sync --locked --all-groups

      # The site serves its own pinned Mermaid (website/package-lock.json)
      # rather than the theme's CDN copy.
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - if: steps.present.outputs.present == 'true'
        working-directory: .
        run: make docs-assets

      # The website's own tests, run against the release's tag. They include
      # a check that every CHANGELOG version has an upgrade page, so a
      # release without its page is never published.
      - if: steps.present.outputs.present == 'true'
        run: uv run pytest

      - if: steps.present.outputs.present == 'true'
        run: uv run zensical build --clean

      - if: steps.present.outputs.present == 'true'
        run: |
          uv run python scripts/check_no_third_party.py site
          uv run python scripts/check_local_links.py site

      - if: steps.present.outputs.present == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site

  docs-deploy:
    needs: docs-build
    # The explicit result check (not the implicit success()) matters: on a
    # manual or docs-only run release-please and images are skipped, and an
    # implicit success() would skip this job along with them.
    if: >-
      !cancelled() && needs.docs-build.result == 'success' &&
      needs.docs-build.outputs.present == 'true' && vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
