# Advisories OSV-Scanner may skip for this Cargo.lock. Each entry is a crate
# Tauri itself pulls in that this project cannot upgrade on its own; the
# expiry date forces a fresh look at whether a Tauri release has moved on.

# glib 0.18 (GTK3 bindings on Linux, via tauri -> muda -> gtk). The unsound
# code is VariantStrIter, which neither Tauri nor this app calls.
# Listed under its GHSA id, which also covers the RUSTSEC-2024-0429 alias.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-04-30T00:00:00Z
reason = "glib 0.18 comes from Tauri's GTK3 stack; VariantStrIter is unused"

