server {
    listen 80;

    # Same-origin proxy: the browser only ever talks to this nginx origin,
    # so no CORS is needed even though the backend is a separate container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # More specific than /api/ above, so nginx matches this for MCP traffic
    # (longest-prefix wins) -- no new Docker port, no new network path to
    # the backend, just streaming-friendly settings on the existing proxied
    # prefix (KTD7). MCP's Streamable HTTP transport needs these beyond
    # what /api/'s defaults provide: buffering off and HTTP/1.1 so
    # long-lived/chunked responses aren't held back or truncated, and an
    # extended read timeout so an idle streaming connection isn't cut.
    location /api/mcp {
        proxy_pass http://backend:8000/api/mcp;
        # $http_host (not $host): the bare /api/mcp path (no trailing
        # slash) gets a 307 redirect to /api/mcp/ from Starlette's Mount,
        # built from this Host header. $host silently drops the port a
        # non-default published port (e.g. :8080) was reached on, sending
        # the client's redirect to the wrong port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
