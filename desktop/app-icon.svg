<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Cerebrum mark: brain from above. Two mirrored hemispheres, longitudinal
    fissure down the centre, a few sulci per side, one spark at the frontal pole.
    Palette from the app dark theme: tile #26221d (bg), matter #ece4d3 (text),
    spark #d9a54a (accent). Tile 512, corner radius 120 (about 23%).
    Right hemisphere is authored once and mirrored with matrix(-1 0 0 1 512 0).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#332E26"/>
      <stop offset="0.5" stop-color="#26221D"/>
      <stop offset="1" stop-color="#1E1A15"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(160 128) scale(300)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matter" x1="110" y1="110" x2="410" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3ECDC"/>
      <stop offset="1" stop-color="#D6C8AE"/>
    </linearGradient>

    <path id="hemi" d="M268 126
      C270 116 280 108 296 106
      C326 102 354 112 372 134
      C384 150 386 166 378 180
      C396 196 412 214 414 238
      C416 258 410 276 400 288
      C414 306 420 330 410 354
      C400 374 380 392 356 396
      C332 400 308 398 294 392
      C282 387 276 378 275 364
      C272 330 272 296 273 264
      C274 220 271 170 268 126 Z"/>

    <g id="sr" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round">
      <path d="M288 168 C316 160 344 162 366 176"/>
      <path d="M286 248 C320 242 352 246 380 258"/>
      <path d="M290 322 C316 330 342 332 362 322"/>
    </g>

    <mask id="sulci" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <use href="#sr"/>
      <use href="#sr" transform="matrix(-1 0 0 1 512 0)"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tile)"/>
  <rect width="512" height="512" rx="120" fill="url(#sheen)"/>

  <g mask="url(#sulci)">
    <use href="#hemi" fill="url(#matter)"/>
    <use href="#hemi" fill="url(#matter)" transform="matrix(-1 0 0 1 512 0)"/>
  </g>

  <!-- brand accent: the spark at the frontal pole -->
  <circle cx="256" cy="118" r="29" fill="#D9A54A" fill-opacity="0.20"/>
  <circle cx="256" cy="118" r="20" fill="#D9A54A"/>
</svg>
