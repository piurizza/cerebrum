repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix'
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format (backend)
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        pass_filenames: false
      - id: pylint
        name: pylint (backend)
        entry: bash -c 'cd backend && uv run pylint src tests'
        language: system
        pass_filenames: false
      - id: biome
        name: biome (frontend)
        entry: bash -c 'cd frontend && npm run check'
        language: system
        types_or: [ts, tsx, javascript, jsx, json]
        pass_filenames: false
