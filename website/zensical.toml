# Cerebrum's documentation site. Build with `make docs-build` from the repo
# root; pages live in docs/, the built site in site/ (gitignored).
#
# Privacy (R19): nothing here may make a visitor's browser contact another
# host. That rules out Google Fonts (font = false) and a `repo_url` (the
# theme would fetch star and fork counts from GitHub's API). Mermaid is
# served from the site itself: the theme fetches it from a CDN only when no
# `mermaid` is loaded yet, and `make docs-assets` copies a pinned one in.
# `make docs-check` and `make docs-check-runtime` enforce all of it.

[project]
site_name = "Cerebrum"
site_url = "https://piurizza.github.io/cerebrum/"
site_description = "Self-hosted second brain: markdown notes with a traversable link graph."
copyright = """
Cerebrum and this documentation are <a href="https://github.com/piurizza/cerebrum/blob/main/LICENSE">MIT licensed</a>.
<a href="https://github.com/piurizza/cerebrum">Source on GitHub</a>.
Product names are trademarks of their respective owners; Cerebrum is not affiliated with them.
Hosted on GitHub Pages, which sets no cookies here; see the
<a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub privacy statement</a>.
"""
strict = true
extra_javascript = ["assets/javascripts/vendor/mermaid.min.js"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "quick-start.md",
    { "Install" = [
      "install/index.md",
      "install/docker.md",
      "install/by-hand.md",
      "install/phone.md",
      "install/desktop.md",
    ] },
    { "Upgrade" = [
      "install/upgrade.md",
      { "Upgrade notes" = [
        "upgrade/index.md",
        "upgrade/0.5.0.md",
        "upgrade/0.4.0.md",
        "upgrade/0.3.0.md",
        "upgrade/0.2.0.md",
        "upgrade/0.1.0.md",
      ] },
    ] },
  ] },
  { "Features" = [
    "features/index.md",
    "features/notes-and-templates.md",
    "features/daily-notes.md",
    "features/links.md",
    "features/tags-and-search.md",
    "features/tag-front-page.md",
    "features/graph.md",
    "features/tasks.md",
    "features/offline.md",
    "features/read-only.md",
  ] },
  { "Running Cerebrum" = [
    "running/index.md",
    "running/accounts.md",
    "running/https.md",
    "running/backups.md",
    "running/identity-provider.md",
    "running/read-only-and-second-instance.md",
    "running/security.md",
  ] },
  { "Agents (MCP)" = [
    "agents/index.md",
    "agents/mcp-setup.md",
    "agents/mcp-tools.md",
  ] },
  { "Import" = [
    "import/index.md",
    "import/obsidian.md",
    "import/joplin.md",
    "import/bear.md",
    "import/logseq.md",
    "import/notion.md",
    "import/apple-notes.md",
    "import/evernote.md",
  ] },
  { "Help" = [
    "help/index.md",
    "help/faq.md",
    "help/troubleshooting.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/configuration.md",
    "reference/rest-api.md",
    { "Development" = [
      "development/index.md",
      "development/architecture.md",
      "development/testing.md",
      "development/releases.md",
    ] },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
