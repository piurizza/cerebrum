services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      CEREBRUM_VAULT_PATH: /data/vault
      # Sourced from the host environment (a root .env, see .env.example),
      # not hardcoded -- `:?` fails the compose run with a clear error
      # instead of silently starting with an empty/missing secret.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:?}
      # Opt-in for bind-mount/network filesystems where inotify events are
      # unreliable (Docker Desktop on macOS/Windows, NFS) -- left empty by
      # default so the operator decides, not an auto-detect guess.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-}
    volumes:
      - ${CEREBRUM_VAULT_HOST_PATH:-./vault}:/data/vault
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      # VITE_* values are baked in at build time (Vite reads them from
      # the process env during `npm run build`), not runtime -- unlike
      # the backend's `environment:` settings above, changing this on an
      # already-deployed instance needs `docker compose build/up
      # frontend`, not just an env edit.
      args:
        VITE_DAILY_NOTE_FOLDER: ${VITE_DAILY_NOTE_FOLDER:-daily}
        VITE_TEMPLATES_FOLDER: ${VITE_TEMPLATES_FOLDER:-templates}
    restart: unless-stopped
    ports:
      - "${CEREBRUM_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
