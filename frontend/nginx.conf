server {
    listen 80;

    include /etc/nginx/nginx-locations.conf;
}

# HTTPS listener for offline mode (docs/plans/2026-08-14-001-feat-desktop-offline-mode-plan.md,
# KD4/U1) -- a service worker only registers in a secure context, which
# plain HTTP satisfies only for the literal "localhost" hostname, not a LAN
# IP. The cert is self-signed and generated on first start by
# docker-entrypoint.sh; kept alongside plain HTTP (not a redirect) so
# existing http:// setups keep working unchanged and offline mode is opt-in
# by using the https:// URL.
server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/cerebrum.crt;
    ssl_certificate_key /etc/nginx/certs/cerebrum.key;

    include /etc/nginx/nginx-locations.conf;
}
