[project]
name = "cerebrum"
version = "0.1.0"
description = "Self-hosted second brain: markdown notes with a traversable link graph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.0",
    "python-frontmatter>=1.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "pylint>=3.2.0",
    "pytest>=8.2.0",
    "ruff>=0.4.8",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
cerebrum = "cerebrum.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebrum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "UP",
    "W",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/cerebrum/api/**/*.py" = ["B008"]  # FastAPI's `Depends(...)` default-arg pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cerebrum"]
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]
recursive = true
jobs = 0

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "redefined-outer-name",  # false positives on pytest fixture params (e.g. `vault`, `app`)
    "broad-exception-caught",  # deliberate: index writes are a disposable cache (see SPEC.md)
]

[tool.pylint.format]
max-line-length = 88
