services:
  backend:
    # Prebuilt image published on every release (see
    # .github/workflows/release.yml); `docker compose pull` fetches it.
    # Building from source lives in docker-compose.build.yml (`make up`),
    # so this file works on its own -- it is also the release's compose.yaml
    # download, with the default version pinned to that release.
    # CEREBRUM_VERSION pins a release (e.g. 0.1.0); default is the latest.
    image: ghcr.io/piurizza/cerebrum-backend:${CEREBRUM_VERSION:-latest}
    restart: unless-stopped
    # Run as the host user that owns the vault, not root -- on native Linux
    # Docker every note the backend creates in the bind-mounted vault would
    # otherwise be root-owned on the host. Docker Desktop hides this by
    # remapping ownership through its VM's file sharing, so it only shows up
    # without it.
    user: "${CEREBRUM_UID:-1000}:${CEREBRUM_GID:-1000}"
    environment:
      APP_ENV: production
      CEREBRUM_VAULT_PATH: /data/vault
      # Sourced from the host environment (a root .env, see .env.example),
      # not hardcoded -- `:?` fails the compose run with a clear error
      # instead of silently starting with an empty/missing secret.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:?}
      # Opt-in for bind-mount/network filesystems where inotify events are
      # unreliable (Docker Desktop on macOS/Windows, NFS) -- left empty by
      # default so the operator decides, not an auto-detect guess.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-}
      # Vault folders the web app uses for "Today" and the template picker,
      # served by `GET /api/vault-settings`. Changing them needs only a
      # restart. Falls back to the VITE_* names these had when they were
      # baked into the frontend build, so an existing .env keeps working.
      CEREBRUM_DAILY_NOTE_FOLDER: ${CEREBRUM_DAILY_NOTE_FOLDER:-${VITE_DAILY_NOTE_FOLDER:-daily}}
      CEREBRUM_TEMPLATES_FOLDER: ${CEREBRUM_TEMPLATES_FOLDER:-${VITE_TEMPLATES_FOLDER:-templates}}
      # `markdown` or `wikilink`: the link form the editor's `[[` picker
      # inserts and MCP tools ask agents to write. Both are always read.
      CEREBRUM_LINK_FORMAT: ${CEREBRUM_LINK_FORMAT:-markdown}
      # IANA time zone (e.g. Europe/Rome) whose today the MCP task tools use
      # when an agent gives no date. Empty means the container's zone, UTC.
      CEREBRUM_TIMEZONE: ${CEREBRUM_TIMEZONE:-}
      # Where the index and the accounts database live. Empty means inside
      # the vault (`<vault>/.cerebrum/`). To keep them out of the vault, set
      # both to paths under /data/cerebrum and enable the data mount below
      # -- see "Read-only vault and a second instance" in the docs before moving an
      # existing accounts database.
      CEREBRUM_INDEX_PATH: ${CEREBRUM_INDEX_PATH:-}
      CEREBRUM_AUTH_DB_PATH: ${CEREBRUM_AUTH_DB_PATH:-}
      # `true` serves the vault without ever writing to it (for a folder
      # another tool owns, e.g. a git checkout). Needs both paths above set
      # outside the vault -- see "Read-only vault and a second instance" in the docs.
      CEREBRUM_VAULT_READ_ONLY: ${CEREBRUM_VAULT_READ_ONLY:-false}
      # Sign in with an OpenID Connect provider (see the docs). Blank means
      # off; the issuer, client id and secret go together.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ALLOW_INSECURE_ISSUER: ${OIDC_ALLOW_INSECURE_ISSUER:-false}
      AUTH_PASSWORD_LOGIN: ${AUTH_PASSWORD_LOGIN:-true}
      # Sessions and the cookie. Turn AUTH_COOKIE_SECURE on once every
      # sign-in goes over HTTPS; plain-HTTP sign-in stops working with it.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-10}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      # The MCP server at /api/mcp, for AI assistants.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      # Largest pasted image, in bytes.
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-10000000}
      # How the server notices notes changed outside it (an editor, a sync
      # tool). The defaults suit most vaults.
      WATCHER_ENABLED: ${WATCHER_ENABLED:-true}
      WATCHER_DEBOUNCE_MS: ${WATCHER_DEBOUNCE_MS:-400}
      WATCHER_BACKSTOP_INTERVAL_SECONDS: ${WATCHER_BACKSTOP_INTERVAL_SECONDS:-300}
      WATCHER_RENAME_PAIRING_WINDOW_SECONDS: ${WATCHER_RENAME_PAIRING_WINDOW_SECONDS:-30}
      # DEBUG, INFO, WARNING, ERROR or CRITICAL: how much Cerebrum logs.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${CEREBRUM_VAULT_HOST_PATH:-./vault}:/data/vault
      # Opt-in: create the folder as yourself first (`mkdir -p data`), or
      # Docker creates it as root and the backend can't write to it.
      # - ${CEREBRUM_DATA_HOST_PATH:-./data}:/data/cerebrum
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    # Same as the backend's `image:` above.
    image: ghcr.io/piurizza/cerebrum-frontend:${CEREBRUM_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Extra Subject Alternative Names for the self-signed HTTPS cert
      # (KD4/U1) -- e.g. "IP:192.0.2.10" for LAN/phone access. Left for
      # the operator to set explicitly, matching WATCHFILES_FORCE_POLLING
      # above: not something to auto-detect and guess at.
      CEREBRUM_TLS_SAN: ${CEREBRUM_TLS_SAN:-}
      # nginx accepts request bodies up to this (plus headroom), so the
      # backend's own limit on pasted images is the one that applies.
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-10000000}
    # Reachable only from this machine unless CEREBRUM_BIND_ADDRESS opens it
    # (0.0.0.0 for every network, or one interface's address). Plain HTTP on
    # every network would expose the login page and the MCP endpoint to
    # whatever Wi-Fi a laptop joins.
    ports:
      - "${CEREBRUM_BIND_ADDRESS:-127.0.0.1}:${CEREBRUM_PORT:-7811}:80"
      - "${CEREBRUM_BIND_ADDRESS:-127.0.0.1}:${CEREBRUM_HTTPS_PORT:-7812}:443"
    volumes:
      # Persists the self-signed cert across restarts -- without this it
      # would regenerate (and need re-trusting in the browser) on every
      # `docker compose up`.
      - cerebrum_tls_certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cerebrum_tls_certs:
