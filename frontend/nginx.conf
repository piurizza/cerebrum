server {
    listen 80;

    # Same-origin proxy: the browser only ever talks to this nginx origin,
    # so no CORS is needed even though the backend is a separate container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
