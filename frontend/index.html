<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- theme-color: the media-less tag FIRST -- it's the fallback browsers
         honour and the one themeColor.ts mutates on the in-app toggle (U7,
         R11). The prefers-color-scheme pair below covers the first paint
         before JS runs and the OS-scheme case. -->
    <meta name="theme-color" content="#26221d" />
    <meta
      name="theme-color"
      content="#f4ede0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#26221d"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cerebrum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Cerebrum</title>
    <!-- Atkinson Hyperlegible Next: a typeface designed and iterated against
         legibility research (character-disambiguation and low-vision
         readability testing), used for both UI chrome and reading content
         -- see index.css's :root comment for the full rationale. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
